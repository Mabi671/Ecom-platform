spring.application.name=ecom-platform

# Database (file-based H2)
spring.datasource.url=${DB_URL:jdbc:h2:file:./db/testdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${APP_DATABASE_USERNAME:sa}
spring.datasource.password=${APP_DATABASE_PASSWORD:}
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seeded admin account (created on first start)
admin.username=${APP_ADMIN_USERNAME:admin}
admin.password=${APP_ADMIN_PASSWORD}
admin.email=${APP_ADMIN_EMAIL:admin@example.com}

# JWT (the secret must be at least 32 bytes for HS256)
jwt.secret=${APP_SECRET}
jwt.expiration-minutes=${APP_EXPIRATION:60}
